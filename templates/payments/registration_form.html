{% extends "base.html" %}

{% block title %}Registration — Grey Academy{% endblock %}

{% block content %}
<section class="section">
  <div class="container" style="max-width:720px;">
    <h1>
      {% if student_type == "siwes" %}
        SIWES Registration
      {% else %}
        Grey Academy Registration
      {% endif %}
    </h1>

    <p>
      Amount to pay:
      <strong>₦{{ amount }}</strong>
    </p>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}

      <button class="btn btn-primary" type="submit">
        Continue to payment
      </button>
    </form>
  </div>
</section>
{% endblock %}
