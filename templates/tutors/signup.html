{% extends "base.html" %}

{% block title %}Tutor Sign Up — Grey Academy{% endblock %}

{% block content %}
<section class="section">
  <div class="container" style="max-width:600px;">
    <h1>Become a tutor</h1>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Create tutor account</button>
    </form>
  </div>
</section>
{% endblock %}
